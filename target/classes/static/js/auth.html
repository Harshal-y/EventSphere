
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | EventSphere</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6fa;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            color: #2367e8;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            background: #f1f3f7;
            border-radius: 9px;
            padding: 4px;
            margin-bottom: 25px;
        }

        .tab {
            width: 50%;
            padding: 12px;
            border: none;
            cursor: pointer;
            border-radius: 7px;
            background: transparent;
            font-size: 14px;
            font-weight: bold;
        }

        .tab.active {
            background: white;
            color: #2367e8;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        h2 {
            font-size: 23px;
            color: #222;
            margin-bottom: 8px;
        }

        .description {
            color: #777;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce1e9;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #2367e8;
            box-shadow: 0 0 0 3px rgba(35,103,232,0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #2367e8;
            cursor: pointer;
            font-size: 12px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #2367e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 7px;
        }

        .submit-btn:hover {
            background: #1855c5;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            font-size: 13px;
            margin: 15px 0;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.error {
            color: #d32f2f;
        }

        .message.success {
            color: #168348;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #2367e8;
            text-decoration: none;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        @media(max-width: 480px) {
            .auth-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="logo">EventSphere</div>

    <p class="subtitle">
        Discover events. Connect with people.
    </p>

    <div class="tabs">

        <button class="tab active" id="loginTab" type="button">
            Login
        </button>

        <button class="tab" id="signupTab" type="button">
            Create Account
        </button>

    </div>

    <!-- LOGIN FORM -->

    <section id="loginSection">

        <h2>Welcome Back!</h2>

        <p class="description">
            Sign in to continue exploring events.
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label for="loginEmail">Email Address</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="loginPassword">Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="loginPassword"
                    >
                        Show
                    </button>

                </div>

            </div>

            <div id="loginMessage" class="message" aria-live="polite"></div>

            <button type="submit" class="submit-btn">
                Login →
            </button>

        </form>

    </section>


    <!-- SIGNUP FORM -->

    <section id="signupSection" class="hidden">

        <h2>Create Account</h2>

        <p class="description">
            Join EventSphere and discover your next experience.
        </p>

        <form id="signupForm">

            <div class="form-group">

                <label for="signupName">Full Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    maxlength="100"
                    required
                >

            </div>

            <div class="form-group">

                <label for="signupEmail">Email Address</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="signupPassword">Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="signupPassword"
                    >
                        Show
                    </button>

                </div>

            </div>

            <div class="form-group">

                <label for="confirmPassword">Confirm Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmPassword"
                    >
                        Show
                    </button>

                </div>

            </div>

            <div id="signupMessage" class="message" aria-live="polite"></div>

            <button type="submit" class="submit-btn">
                Create Account →
            </button>

        </form>

    </section>

    <a href="index.html" class="back-link">
        ← Back to Explore Events
    </a>

</div>

<script type="module" src="js/auth-page.js"></script>

</body>
</html>
