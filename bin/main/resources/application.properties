
spring.application.name=EventSphere
server.port=${PORT8080}

# Local development database
spring.datasource.url=${SPRING_DATASOURCE_URLjdbch2memeventspheredb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAMEsa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console for local development
spring.h2.console.enabled=${H2_CONSOLE_ENABLEDtrue}
spring.h2.console.path=h2-console

# Frontend URL
app.frontend-url=${FRONTEND_URLhttp127.0.0.15500}
